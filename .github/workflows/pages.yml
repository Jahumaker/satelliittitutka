name: Update orbits and publish Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      resume_source:
        description: 'Resume CelesTrak requests after investigating a source error'
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: satellite-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update orbital data
        id: orbits
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          RESUME_SOURCE: ${{ inputs.resume_source || 'false' }}
        run: python scripts/update_orbits.py

      - name: Persist data and source pause state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update orbital data or source status [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - name: Stage public site
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css _site/
          touch _site/.nojekyll
          cp data/orbits.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Artifact upload can complete before the metadata API lists it.
      # Retry only the read-only availability check, never the source download.
      - name: Wait for publication artifact
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 1; attempt <= 12; attempt++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                name: 'github-pages',
                per_page: 100
              });
              if (result.data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) {
                core.info('Publication artifact is available.');
                return;
              }
              core.info('Waiting for uploaded artifact metadata (' + attempt + '/12).');
              if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Uploaded publication artifact did not become available within 110 seconds. Source data remains saved; no source retry was made.');

      - name: Allow publication metadata to settle
        run: sleep 20

      - name: Deploy Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before publication retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry publication only
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final publication attempt
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 60

      - name: Final publication attempt
        if: steps.deployment_retry.outcome == 'failure'
        id: deployment_final
        uses: actions/deploy-pages@v4

      - name: Report source error after publishing last good data
        if: steps.orbits.outcome == 'failure'
        run: |
          echo "Source requests paused. Inspect data/update-blocked.json. Last good data was published."
          exit 1
